# Launcher (Super+Space), themed to match foot/Sway colours.
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="    "
placeholder=Search apps…
icon-theme=Yaru-wartybrown-dark
icons-enabled=yes
terminal=foot -e
layer=overlay
anchor=center
lines=10
width=60
horizontal-pad=10
vertical-pad=8
inner-pad=12
line-height=26
match-mode=fzf
show-actions=no
fields=name,generic,keywords,categories,filename
image-size-ratio=0.4

[colors]
# RRGGBBAA
background=000000f2
text=b8b8b8ff
prompt=3584e4ff
placeholder=6c7380ff
input=ffffffff
match=f6d32dff
selection=3584e4ff
selection-text=ffffffff
selection-match=f9f06bff
counter=6c7380ff
border=3584e4ff

[border]
width=2
radius=0
