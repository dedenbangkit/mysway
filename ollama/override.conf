# Ollama service tuned for the RTX 5060 (8 GB). Installed by install.sh as
# /etc/systemd/system/ollama.service.d/override.conf
[Service]
# Run as me so models live on /home, not the small / partition
User=dedenbangkit
Group=dedenbangkit
Environment="OLLAMA_MODELS=/home/dedenbangkit/.ollama/models"
# Halve the memory a conversation takes, so more stays on the GPU
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Enough for chat (Sahabat-AI's own limit); summaries ask for more per request
Environment="OLLAMA_CONTEXT_LENGTH=8192"
# Free the GPU (it also drives HDMI) after 5 idle minutes
Environment="OLLAMA_KEEP_ALIVE=5m"
