# mpv, with the uosc UI and thumbfast seekbar thumbnails (fetched by install.sh).

# Video: hardware decode on the Intel iGPU (VA-API, needs intel-media-va-driver),
# falling back to nvdec on the RTX 5060
vo=gpu-next
hwdec=vaapi,vaapi-copy,nvdec,auto-safe
# renderD128 is the NVIDIA card; point VA-API at the Intel iGPU
vaapi-device=/dev/dri/by-path/pci-0000:00:02.0-render
# Render on the Intel iGPU as well: drawing on the RTX 5060 for an Intel-driven
# screen fails (VK_ERROR_OUT_OF_DEVICE_MEMORY).
vulkan-device='Intel(R) Graphics (ARL)'
profile=high-quality

# uosc draws the UI, so turn off mpv's own OSC and bars
osc=no
osd-bar=no
border=no

# Window
autofit-larger=90%x90%
keep-open=yes
save-position-on-quit=yes

# Languages
slang=en,eng,id,ind
alang=en,eng,ja,jpn,id,ind
sub-auto=fuzzy

# OSD/subtitles in the desktop font
osd-font='JetBrainsMono Nerd Font'
sub-font='JetBrainsMono Nerd Font'
sub-border-size=2

# Streams via yt-dlp (pipx); cap at 1440p. Signed in to YouTube (Premium)
# with the snap Firefox's cookies, so stay logged in there.
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
ytdl-raw-options-append=cookies-from-browser=firefox

# Screenshots next to the Sway ones
screenshot-directory=~/Pictures
screenshot-template=mpv-%F-%P
screenshot-format=png
