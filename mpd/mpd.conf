# MPD as a user service (systemctl --user enable --now mpd); rmpc, mpc and waybar connect to localhost:6600.
music_directory    "~/Music"
playlist_directory "~/.local/share/mpd/playlists"
db_file            "~/.local/share/mpd/database"
sticker_file       "~/.local/share/mpd/sticker.sql"
state_file         "~/.local/state/mpd/state"

bind_to_address "127.0.0.1"
port            "6600"

# pick up new files in ~/Music automatically, and resume paused after a restart
auto_update    "yes"
restore_paused "yes"

audio_output {
  type "pipewire"
  name "PipeWire"
}
