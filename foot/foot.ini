# foot — ported from the old gnome-terminal "Regolith" profile (github.com/dedenbangkit/my-i3wm)
[main]
font=JetBrainsMono Nerd Font:size=10
bold-text-in-bright=no

[scrollback]
lines=100000

[cursor]
style=block
blink=no

[bell]
urgent=no
notify=no
visual=no

[colors]
alpha=0.95
background=2d3743
foreground=B8B8B8
selection-foreground=2d3743
selection-background=9A9996
# text-under-cursor  cursor
cursor=E01B24 9A9996

regular0=2d3743
regular1=E01B24
regular2=8FF0A4
regular3=F6D32D
regular4=3584E4
regular5=9141AC
regular6=95E6CB
regular7=B8B8B8

bright0=9A9996
bright1=E01B24
bright2=33D17A
bright3=F9F06B
bright4=99C1F1
bright5=75507B
bright6=5CCFE6
bright7=FFFFFF
