# Tables (csv/tsv/parquet/xlsx/duckdb) previewed with duckdb.yazi (needs the duckdb CLI in ~/.local/bin).
# JSON stays on yazi's built-in jq preview.
[mgr]
ratio = [1, 3, 4]

[plugin]
prepend_preloaders = [
  { url = "*.csv",     run = "duckdb", multi = false },
  { url = "*.tsv",     run = "duckdb", multi = false },
  { url = "*.parquet", run = "duckdb", multi = false },
  { url = "*.xlsx",    run = "duckdb", multi = false },
]
prepend_previewers = [
  { url = "*.csv",     run = "duckdb" },
  { url = "*.tsv",     run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },
  { url = "*.xlsx",    run = "duckdb" },
  { url = "*.db",      run = "duckdb" },
  { url = "*.duckdb",  run = "duckdb" },
]
